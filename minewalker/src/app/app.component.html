<app-winner-prompt *ngIf="hasWon()"> </app-winner-prompt>
<app-game-over *ngIf="isGameOver()"> </app-game-over>
<header>
  <h1>Minewalker</h1>
  <p class="how-to">
    Get the 🐸 to the ⭐️ without stepping on a mine. Tap a square next to the
    frog, or use the arrow keys. The colored strip under the board shows how many
    mines are next to you.
  </p>
  <p class="message" role="status" aria-live="polite">{{ messageService.text }}</p>
</header>
<main>
  <aside class="left"></aside>
  <app-board *ngIf="boardSize" [ngStyle]="boardStyles"> </app-board>
  <aside class="right"></aside>
</main>
<footer>
  <app-user-interface> </app-user-interface>
</footer>
