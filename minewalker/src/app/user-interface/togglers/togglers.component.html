<button type="button" (click)="toggleHappyPath(true)" *ngIf="!showHappyPath" class="toggles">
  Show Happy Path
</button>
<button type="button" (click)="toggleHappyPath(false)" *ngIf="showHappyPath" class="toggles">
  Hide Happy Path
</button>
<button type="button" (click)="toggleMines(true)" *ngIf="!showMines" class="toggles">
  Show Mines
</button>
<button type="button" (click)="toggleMines(false)" *ngIf="showMines" class="toggles">
  Hide Mines
</button>
